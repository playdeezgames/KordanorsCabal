<!doctype html><meta charset="utf-8"><title>memory</title><pre id="out"></pre>
<script src="odin.js"></script>
<script>
const out = document.getElementById("out"); const log = (...a) => { out.textContent += a.join(" ") + "\n"; };
const mem = new odin.WasmMemoryInterface();
odin.runWasm("memory.wasm", null, {}, mem).then(async () => {
	const e = mem.exports, pages = () => mem.memory.buffer.byteLength / 65536;
	log("exports:", Object.keys(e).join(", "));
	log("initial memory pages (64 KiB):", pages(), "=", pages() * 64, "KiB");
	for (const g of ["__heap_base", "__data_end", "__stack_pointer", "__stack_low", "__stack_high"]) if (e[g]) log(g, "=", e[g] instanceof WebAssembly.Global ? e[g].value : e[g]);
	let before = pages(); e.alloc_megabytes(8); log("alloc+free 8 x 1 MiB: pages", before, "->", pages());
	before = pages(); e.alloc_megabytes(8); log("again (memory is reused, not regrown): pages", before, "->", pages());
	before = pages(); e.temp_churn(2000); log("temp churn 2000 frames, freed each frame: pages", before, "->", pages());
	before = pages(); try { e.temp_leak(500); } catch (err) { log("temp leak trap:", err.message); } log("temp leak 500 frames, never freed: pages", before, "->", pages());
	log("arena in a 512 KiB heap block fits", e.arena_roundtrip(512), "x 4 KiB allocations");
	log("max memory the browser allows (probe): trying to grow...");
	try { const m = new WebAssembly.Memory({ initial: 1, maximum: 65536 }); let n = 0; while (n < 65536) { try { m.grow(256); n += 256; } catch { break; } if (n >= 16384) break; } log("this tab can grow a test memory to at least", (n + 1) * 64 / 1024, "MiB"); } catch (err) { log("probe failed", err.message); }
	// stack depth until trap (1 KiB frames)
	let ok = 0; for (const d of [10, 30, 60, 100, 200, 400, 800, 1600, 3200, 6400]) { try { e.stack_probe(d); ok = d; } catch (err) { log("stack trap at depth", d, "(last ok", ok, "KiB frames):", err.message); break; } }
	if (ok === 6400) log("stack ok to 6400 KiB");
});
</script>
