<!doctype html><meta charset="utf-8"><title>storage</title>
<pre id="out"></pre>
<script src="odin.js"></script>
<script src="storage.js"></script>
<script>
const out = document.getElementById("out");
const log = console.log; console.log = (...a)=>{ log(...a); out.textContent += a.join(" ")+"\n"; };
const mem = new odin.WasmMemoryInterface();
odin.runWasm("storage.wasm", null, storageImports(mem), mem).catch(e=>{ out.textContent += "ERR "+e+"\n"; });
</script>
